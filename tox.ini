# tox (https://tox.readthedocs.io/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.


# Python 3.6 was the version deployed on Ubuntu 18.04
# Python 3.8 was the version deployed on Ubuntu 20.04
# Python 3.10 is the version deployed on the Ubuntu 22.04 master
# Python 3.12 is the version deployed on the Ubuntu 24.04 master
# Python 3.14 is the version deployed on the Ubuntu 26.04 master
[tox]
envlist = py310, py312, py314, cov, codestyle

[gh-actions]
python =
    3.10: py310, codestyle, cov
    3.12: py312
    3.14: py314

[testenv]
# Use uv sync to install from lockfiles (all symlink to uv-3.10.lock)
# Then install the package in development mode
allowlist_externals = sh
                     uv
                     cp
install_command = sh -c 'python -I -m pip install uv && cp requirements/uv-3.10.lock uv.lock && uv sync --all-groups --active && uv pip install -e .' -
commands = pytest {posargs}

[testenv:cov]
commands = pytest --cov --cov-config=pyproject.toml \
                  --cov-report=term --cov-report=xml {posargs}

[testenv:codestyle]
# pre-commit needs to clone Git repositories over https
passenv = http_proxy,https_proxy,no_proxy
# do not inherit the uv-based install command from testenv
install_command = python -I -m pip install {opts} {packages}
commands = pre-commit run --all-files
deps =
    pre-commit
